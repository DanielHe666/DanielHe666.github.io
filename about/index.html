<!DOCTYPE html>
<html lang="zh-Hans">
<head>

<body>
  <div class="site-shell">
    <div class="reading-progress" id="reading-progress" role="presentation" aria-hidden="true"></div>
    
    <div
      class="site-audio"
      data-audio-player
      data-autoplay="false"
      data-start-muted="false"
      data-volume-expanded="false"
    >
      <div class="site-audio__cover" style="background-image: url('/media/cover.jpg');">
        
        <button class="site-audio__cover-toggle" type="button" data-audio-toggle aria-label="播放或暂停背景音乐" data-audio-no-drag>
          <span class="site-audio__cover-blur" aria-hidden="true"></span>
          <svg class="site-audio__icon site-audio__icon--play" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5.5v13l10-6.5z" />
          </svg>
          <svg class="site-audio__icon site-audio__icon--pause" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5.5h3v13H8zm5 0h3v13h-3z" />
          </svg>
        </button>
      </div>
      <div class="site-audio__meta">
        <div class="site-audio__title-row">
          <span class="site-audio__title">日落</span>
          <span class="site-audio__time" data-audio-time>00:00</span>
        </div>
        
        <span class="site-audio__artist">孙燕姿</span>
        
        <div
          class="site-audio__progress"
          data-audio-progress-track
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          data-audio-no-drag
        >
          <div class="site-audio__progress-bar" data-audio-progress></div>
        </div>
      </div>
      <div class="site-audio__controls">
        <div class="site-audio__volume-shell" data-audio-no-drag>
          <button class="site-audio__control site-audio__control--mute" type="button" data-audio-mute aria-label="切换静音" data-audio-no-drag>
            <svg class="site-audio__icon site-audio__icon--volume" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 10h2.586L12 5.586V18.5L7.586 14H5z" />
              <path d="M15.5 8.5a4 4 0 0 1 0 6" />
              <path d="M17.5 6.5a6 6 0 0 1 0 10" />
            </svg>
            <svg class="site-audio__icon site-audio__icon--muted" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 10h2.586L12 5.586V18.5L7.586 14H5z" />
              <path d="M15 9l6 6" />
              <path d="M21 9l-6 6" />
            </svg>
          </button>
          <div class="site-audio__volume" data-audio-volume aria-hidden="true">
            <input
              class="site-audio__volume-slider"
              type="range"
              min="0"
              max="100"
              value="100"
              step="1"
              data-audio-volume-slider
              tabindex="-1"
              aria-label="调节音量"
              data-audio-no-drag
            />
          </div>
        </div>
      </div>
      <audio
        data-audio-element
        loop
        preload="auto"
        src="/media/日落.mp3"
      ></audio>
    </div>
    
    <header class="site-header" role="banner">

        <div class="brand">

        </div>
        
        <nav class="site-nav" aria-label="主导航">
          
          <a class="site-nav__link" href="/">首页</a>
          
          <a class="site-nav__link" href="/archive/">归档</a>
          
          <a class="site-nav__link" href="/tags/">标签</a>
          
          <a class="site-nav__link" href="/about/">About</a>
          
        </nav>
        
        <div class="site-header__actions">
          <button class="theme-toggle" type="button" data-theme-toggle data-theme-state="light" aria-pressed="false" aria-label="切换到夜间模式">
            <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true">

              </svg>
            </span>
            <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.742 14.045a1 1 0 0 0-1.077-.217 7 7 0 0 1-9.493-7.92 1 1 0 0 0-1.149-1.2A9 9 0 1 0 21 15a1 1 0 0 0-.258-.955z" />
              </svg>
            </span>
            <span class="sr-only">切换主题</span>
          </button>
          <a class="site-header__search" href="/search/">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10.5 4a6.5 6.5 0 0 1 5.196 10.49l3.907 3.907-1.414 1.414-3.907-3.907A6.5 6.5 0 1 1 10.5 4zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z" />
            </svg>
            <span>站内搜索</span>
          </a>
        </div>
      </div>
    </header>
    <main class="main-content">
      <div class="container">
        
<article class="page">

</article>

      </div>

    <footer class="site-footer" role="contentinfo">
      <div class="container site-footer__inner">
        <div>
